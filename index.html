<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Men's Cut Studio — Выберите филиал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#fff;background:#0a0a0a}
.page{
height:100vh;height:100dvh;
display:flex;flex-direction:column;justify-content:center;
position:relative;
padding:clamp(20px,4vw,60px) clamp(20px,4vw,56px);
align-items:flex-start;overflow:hidden;
}
.page::before{
content:'';position:fixed;inset:0;
background:url('photo_2026-04-25 16.23.28.jpeg') center bottom/cover no-repeat;
background-color:#0a0a0a;
z-index:0;
}
.page::after{
content:'';position:fixed;inset:0;
background:linear-gradient(115deg,rgba(0,0,0,0.78) 0%,rgba(0,0,0,0.5) 45%,rgba(0,0,0,0.15) 100%);
z-index:1;
}
.content{position:relative;z-index:2;max-width:1500px;width:100%}
.title-block{margin-bottom:clamp(20px,3vw,44px)}
h1,.title-gold{font-family:'Montserrat',sans-serif;font-weight:800;font-size:clamp(26px,4.2vw,72px);line-height:1.05;letter-spacing:-0.005em}
.title-gold{color:#c8a55a;margin-top:6px}
.subtitle{font-family:'Inter',sans-serif;font-weight:400;font-size:clamp(13px,1.2vw,20px);color:rgba(255,255,255,0.65);line-height:1.5;margin-top:clamp(8px,1vw,14px);max-width:520px}
.lower{max-width:560px;width:100%}
.branches{display:flex;flex-direction:column;gap:clamp(8px,0.9vw,12px);margin-bottom:clamp(20px,3vw,44px);max-width:clamp(320px,30vw,480px)}
.branch{
display:flex;align-items:center;justify-content:space-between;gap:14px;
padding:clamp(12px,1.1vw,18px) clamp(18px,1.4vw,26px);
background:transparent;
border:1px solid rgba(200,165,90,0.55);
border-radius:999px;
text-decoration:none;color:#fff;
font-family:'Inter',sans-serif;
font-size:clamp(14px,1.1vw,20px);font-weight:500;
transition:background .25s,border-color .25s,transform .18s;
}
.branch:hover{background:rgba(200,165,90,0.12);border-color:rgba(200,165,90,0.85);transform:translateY(-2px)}
.branch:active{transform:scale(0.98)}
.branch-arrow{color:#c8a55a;font-weight:600;flex-shrink:0}
.logo-bottom img{width:clamp(180px,16vw,320px);height:auto;display:block;opacity:1}
@media(max-width:700px){
.title-block{margin-bottom:18px}
h1,.title-gold{font-size:clamp(24px,7.5vw,40px)}
.subtitle{font-size:clamp(12px,3.4vw,15px)}
.branches{max-width:100%;gap:8px;margin-bottom:18px}
.branch{padding:12px 18px;font-size:14px}
.logo-bottom img{width:160px}
.page{padding:24px 22px}
}
@media(max-height:680px) and (max-width:700px){
h1,.title-gold{font-size:clamp(22px,6.5vw,34px)}
.branches{gap:6px;margin-bottom:12px}
.branch{padding:10px 16px}
.logo-bottom img{width:140px}
}
</style>
</head>
<body>
<div class="page">
<div class="content">
<div class="title-block">
<h1>Выберите ваш</h1>
<p class="title-gold">филиал</p>
<p class="subtitle">Где вы стриглись? Выберите адрес, чтобы оставить отзыв</p>
</div>
<div class="lower">
<div class="branches">
<a class="branch" href="/1"><span>Грибалевой 7</span><span class="branch-arrow">→</span></a>
<a class="branch" href="/2"><span>Б. Пушкарская</span><span class="branch-arrow">→</span></a>
<a class="branch" href="/3"><span>Энгельса</span><span class="branch-arrow">→</span></a>
<a class="branch" href="/4"><span>Уральская</span><span class="branch-arrow">→</span></a>
<a class="branch" href="/5"><span>Фёдора Абрамова</span><span class="branch-arrow">→</span></a>
<a class="branch" href="/6"><span>Авиаконструкторов</span><span class="branch-arrow">→</span></a>
</div>
<div class="logo-bottom">
<img src="5434033842160342273-Photoroom.png" alt="Men's Cut Studio">
</div>
</div>
</div>
</div>
</body>
</html>
